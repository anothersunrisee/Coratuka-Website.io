<!DOCTYPE html>
<html lang="id" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register Visitor – CoraTuka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#15C5CE",
                50: "#E8F9FA",
                100: "#D0F3F5",
                200: "#B9EEF0",
                300: "#A1E8EB",
                400: "#73DCE2",
                500: "#44D1D8",
                600: "#15C5CE",
                700: "#119EA5",
              },
              secondary: { DEFAULT: "#FF8156" },
              tertiary: { DEFAULT: "#FFD166" },
              ink: "#4B4B4B",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="min-h-full bg-gradient-to-br from-primary-50 via-white to-blue-50 font-inter text-ink"
  >
    <div
      id="notificationOverlay"
      class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/30 backdrop-blur-sm transition-all duration-300"
    >
      <div
        id="notification"
        class="mx-4 w-full max-w-md transform scale-95 opacity-0 transition-all duration-300"
      >
        <div
          class="rounded-2xl bg-white px-8 py-6 shadow-2xl border-2 border-primary-200"
        >
          <div class="flex flex-col items-center text-center">
            <div
              id="notifIcon"
              class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-tertiary/20"
            >
              <svg
                class="h-8 w-8 text-tertiary"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            </div>
            <h3 id="notifTitle" class="mb-2 text-lg font-bold text-slate-800">
              Informasi
            </h3>
            <p id="notifMessage" class="mb-6 text-sm text-slate-600">
              Pesan notifikasi
            </p>
            <button
              onclick="closeNotification()"
              class="w-full rounded-lg bg-tertiary px-6 py-3 text-sm font-bold text-slate-800 transition hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50"
            >
              Mengerti
            </button>
          </div>
        </div>
      </div>
    </div>
    <main class="min-h-screen px-4 py-8">
      <div class="mx-auto max-w-7xl">
        <button
          id="btnBack"
          type="button"
          class="mb-6 inline-flex h-12 w-16 items-center justify-center rounded-2xl bg-tertiary text-slate-800 shadow-lg transition hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
        <header class="mb-8 text-center">
          <h1
            class="text-4xl font-extrabold leading-tight text-slate-900 md:text-5xl"
          >
            Fill up your data here!
          </h1>
          <p class="mt-3 text-lg text-slate-600">
            Lengkapi data agar akun
            <strong class="font-bold text-slate-900">Visitor-mu</strong> lebih
            detail
          </p>
        </header>
        <form
          class="mx-auto max-w-6xl space-y-6"
          onsubmit="handleRegister(event)"
        >
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2 md:gap-14">
            <div class="space-y-4">
              <div class="space-y-2">
                <label
                  for="name"
                  class="block text-xs font-semibold text-slate-700"
                  >Name</label
                >
                <input
                  id="name"
                  name="name"
                  type="text"
                  required
                  placeholder="Input Name"
                  class="w-full rounded-lg border-2 border-slate-300 bg-white px-4 py-4 text-base text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                />
                <small class="text-xs text-slate-500"
                  >Masukkan nama lengkap</small
                >
              </div>
              <div class="space-y-2">
                <label
                  for="email"
                  class="block text-xs font-semibold text-slate-700"
                  >Email Visitor</label
                >
                <input
                  id="email"
                  name="email"
                  type="email"
                  required
                  placeholder="Input Email"
                  class="w-full rounded-lg border-2 border-slate-300 bg-white px-4 py-4 text-base text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                />
                <small class="text-xs text-slate-500"
                  >Gunakan email aktif</small
                >
              </div>
              <div class="space-y-2">
                <label
                  for="phone"
                  class="block text-xs font-semibold text-slate-700"
                  >Phone Number</label
                >
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  inputmode="numeric"
                  required
                  placeholder="Input Number"
                  pattern="08[0-9]{8,}"
                  class="w-full rounded-lg border-2 border-slate-300 bg-white px-4 py-4 text-base text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                />
                <small class="text-xs text-slate-500">use 08xxx</small>
              </div>
              <div class="space-y-2">
                <label
                  for="school"
                  class="block text-xs font-semibold text-slate-700"
                  >School / University</label
                >
                <input
                  id="school"
                  name="school"
                  type="text"
                  required
                  placeholder="Input School / University"
                  class="w-full rounded-lg border-2 border-slate-300 bg-white px-4 py-4 text-base text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                />
                <small class="text-xs text-slate-500"
                  >Opsional untuk visitor</small
                >
              </div>
            </div>
            <div class="space-y-4">
              <div class="space-y-2">
                <label
                  for="password"
                  class="block text-xs font-semibold text-slate-700"
                  >Password</label
                >
                <div class="relative">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    minlength="8"
                    placeholder="Input Password"
                    class="w-full rounded-lg border-2 border-slate-300 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                  />
                  <button
                    type="button"
                    id="togglePassword"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-700 focus:outline-none"
                  >
                    <svg
                      id="eyeIconPassword"
                      class="h-5 w-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>
                <small class="text-xs text-slate-500"
                  >Password must contain at least 8 characters and can't use any
                  symbols</small
                >
              </div>
              <div class="space-y-2">
                <label
                  for="repassword"
                  class="block text-xs font-semibold text-slate-700"
                  >Repeat Password</label
                >
                <div class="relative">
                  <input
                    id="repassword"
                    name="repassword"
                    type="password"
                    required
                    minlength="8"
                    placeholder="Input Password"
                    class="w-full rounded-lg border-2 border-slate-300 bg-white px-4 py-4 pr-12 text-base text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-400 focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                  />
                  <button
                    type="button"
                    id="toggleRepassword"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-700 focus:outline-none"
                  >
                    <svg
                      id="eyeIconRepassword"
                      class="h-5 w-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>
                <small class="text-xs text-slate-500"
                  >Ulangi password yang sama</small
                >
              </div>
              <button
                type="submit"
                class="mt-6 inline-flex w-full items-center justify-center rounded-lg bg-tertiary px-4 py-4 text-base font-extrabold text-slate-800 shadow-lg transition hover:-translate-y-0.5 hover:shadow-xl hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50"
              >
                Register
              </button>
              <div class="flex items-center gap-4 py-2">
                <div class="h-px flex-1 bg-slate-300"></div>
                <span class="text-sm font-medium text-slate-500">Or</span>
                <div class="h-px flex-1 bg-slate-300"></div>
              </div>
              <button
                type="button"
                onclick="handleGoogleRegister()"
                class="inline-flex w-full items-center justify-center gap-3 rounded-lg border-2 border-slate-200 bg-white px-4 py-3.5 text-base font-semibold text-slate-800 shadow-sm transition hover:border-slate-300 hover:bg-slate-50 hover:shadow focus:outline-none focus:ring-4 focus:ring-primary-100"
              >
                <svg class="h-6 w-6" viewBox="0 0 24 24">
                  <path
                    fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  />
                </svg>
                <span>Fill Up with Google</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </main>
    <script>
      document.getElementById("btnBack")?.addEventListener("click", () => {
        window.location.href = "register.html";
      });
      const passwordInput = document.getElementById("password"),
        togglePasswordBtn = document.getElementById("togglePassword"),
        eyeIconPassword = document.getElementById("eyeIconPassword");
      togglePasswordBtn?.addEventListener("click", () => {
        const e = passwordInput.type === "text";
        (passwordInput.type = e ? "password" : "text"),
          (eyeIconPassword.innerHTML = e
            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>'
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>');
      });
      const repasswordInput = document.getElementById("repassword"),
        toggleRepasswordBtn = document.getElementById("toggleRepassword"),
        eyeIconRepassword = document.getElementById("eyeIconRepassword");
      toggleRepasswordBtn?.addEventListener("click", () => {
        const e = repasswordInput.type === "text";
        (repasswordInput.type = e ? "password" : "text"),
          (eyeIconRepassword.innerHTML = e
            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>'
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>');
      });
      function showNotification(e, t = "Informasi", o = "info") {
        const n = document.getElementById("notificationOverlay"),
          r = document.getElementById("notification"),
          i = document.getElementById("notifTitle"),
          s = document.getElementById("notifMessage"),
          a = document.getElementById("notifIcon");
        (i.textContent = t), (s.textContent = e);
        let c = "",
          l = "",
          d = "";
        o === "error"
          ? ((l = "bg-red-100"),
            (d = "text-red-600"),
            (c =
              '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>'))
          : o === "success"
          ? ((l = "bg-green-100"),
            (d = "text-green-600"),
            (c =
              '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'))
          : ((l = "bg-tertiary/20"),
            (d = "text-tertiary"),
            (c =
              '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>')),
          (a.className = `mb-4 flex h-16 w-16 items-center justify-center rounded-full ${l}`),
          (a.innerHTML = `<div class="${d}">${c}</div>`),
          n.classList.remove("hidden"),
          n.classList.add("flex"),
          setTimeout(() => {
            r.classList.remove("scale-95", "opacity-0"),
              r.classList.add("scale-100", "opacity-100");
          }, 10);
      }
      function closeNotification() {
        const e = document.getElementById("notificationOverlay"),
          t = document.getElementById("notification");
        t.classList.remove("scale-100", "opacity-100"),
          t.classList.add("scale-95", "opacity-0"),
          setTimeout(() => {
            e.classList.remove("flex"), e.classList.add("hidden");
          }, 300);
      }
      function handleRegister(e) {
        e.preventDefault();
        const t = document.getElementById("name").value.trim(),
          o = document.getElementById("email").value.trim(),
          n = document.getElementById("phone").value.trim(),
          r = document.getElementById("school").value.trim(),
          i = passwordInput.value,
          s = repasswordInput.value;
        if (!t || !o || !n || !i || !s)
          return void showNotification(
            "Wah, masih ada yang kosong nih! Tuka butuh data penting terisi buat bikin akunmu ya 😊",
            "Data Belum Lengkap",
            "error"
          );
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o))
          return void showNotification(
            "Hmm... format email-nya kayaknya kurang tepat deh. Pastikan ada '@' dan domain yang benar ya! 📧",
            "Format Email Salah",
            "error"
          );
        if (!n.startsWith("08") || n.length < 10)
          return void showNotification(
            "Nomor HP harus diawali dengan 08 dan minimal 10 digit ya! Contoh: 08123456789 📱",
            "Format Nomor HP Salah",
            "error"
          );
        if (i.length < 8)
          return void showNotification(
            "Password-nya masih terlalu pendek nih! Minimal 8 karakter ya biar lebih aman 🔐",
            "Password Terlalu Pendek",
            "error"
          );
        if (/[!@#$%^&*(),.?":{}|<>]/.test(i))
          return void showNotification(
            "Eh, ada simbol nih! Password nggak boleh pakai simbol ya. Cukup huruf dan angka aja 😊",
            "Simbol Tidak Diperbolehkan",
            "error"
          );
        if (i !== s)
          return void showNotification(
            "Hmm... kedua password yang kamu ketik nggak sama nih. Coba cek lagi ya! 🤔",
            "Password Tidak Sama",
            "error"
          );
        showNotification(
          `Yeay! Akun Visitor untuk ${t} berhasil dibuat! Selamat datang di petualangan laut bersama Tuka! 🎉🏖️`,
          "Registrasi Berhasil!",
          "success"
        ),
          sessionStorage.setItem(
            "new_user",
            JSON.stringify({
              role: "Visitor",
              name: t,
              email: o,
              phone: n,
              school: r,
              registeredAt: new Date().toISOString(),
            })
          ),
          console.log("=== NEW USER REGISTERED ==="),
          console.log("Role: Visitor"),
          console.log("Name:", t),
          console.log("Email:", o),
          setTimeout(() => {
            window.location.href = "../welcome/welcome.html";
          }, 2e3);
      }
      function handleGoogleRegister() {
        showNotification(
          "Tuka dan tim masih sibuk berenang ngatur fitur ini nih! Tunggu sebentar ya, nanti pasti bisa register pakai Google juga 🏊‍♂️💙",
          "Fitur Dalam Pengembangan",
          "info"
        );
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const t = document.getElementById("notificationOverlay");
          t.classList.contains("hidden") || closeNotification();
        }
      }),
        document
          .getElementById("notificationOverlay")
          ?.addEventListener("click", (e) => {
            e.target.id === "notificationOverlay" && closeNotification();
          });
    </script>
    <style>
      * {
        transition-property: color, background-color, border-color,
          text-decoration-color, fill, stroke, opacity, box-shadow, transform;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }
      *:focus-visible {
        outline: 2px solid #15c5ce;
        outline-offset: 2px;
      }
      #notification {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </body>
</html>
