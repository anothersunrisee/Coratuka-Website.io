<!DOCTYPE html>
<html lang="id" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register – CoraTuka</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#15C5CE",
                50: "#E8F9FA",
                100: "#D0F3F5",
                200: "#B9EEF0",
                300: "#A1E8EB",
                400: "#73DCE2",
                500: "#44D1D8",
                600: "#15C5CE",
                700: "#119EA5",
              },
              secondary: { DEFAULT: "#FF8156" },
              tertiary: { DEFAULT: "#FFD166" },
              ink: "#4B4B4B",
            },
            boxShadow: {
              card: "0 10px 24px rgba(17, 24, 39, 0.08)",
            },
            borderRadius: {
              xl2: "1.25rem",
            },
          },
        },
        darkMode: ["class"],
      };
    </script>
  </head>

  <body
    class="min-h-full bg-gradient-to-br from-primary-50 via-white to-blue-50 font-inter text-ink"
  >
    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-6xl">
        <!-- Grid responsif: 1 kolom di mobile, 2 kolom di md+ -->
        <div
          class="grid grid-cols-1 gap-0 overflow-hidden rounded-3xl bg-white shadow-2xl md:grid-cols-2"
        >
          <!-- Panel kiri (gambar) -->
          <section
            class="relative overflow-hidden bg-gradient-to-br from-primary-100 to-primary-50 flex items-center justify-center p-8"
          >
            <img
              src="../../img/register/register.png"
              alt="Ilustrasi Register CoraTuka"
              class="h-auto w-full max-h-[600px] object-contain"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />

            <!-- Fallback jika gambar tidak ada -->
            <div
              class="hidden h-full w-full items-center justify-center bg-gradient-to-br from-primary-400 to-primary-600 p-8"
            >
              <div class="text-center text-white">
                <div class="mb-4 text-6xl">🌊</div>
                <h2 class="text-2xl font-bold">CORATUKA</h2>
                <p class="mt-2 text-primary-100">Bergabung Bersama Kami</p>
              </div>
            </div>

            <!-- Tombol Back -->
            <button
              id="btnBack"
              type="button"
              aria-label="Kembali ke Login"
              class="absolute left-4 top-4 inline-flex h-10 w-10 items-center justify-center rounded-xl bg-tertiary text-slate-800 shadow-lg transition hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
            >
              <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M15 19l-7-7 7-7"
                />
              </svg>
            </button>
          </section>

          <!-- Panel kanan (role selection) -->
          <section class="flex flex-col justify-center p-8 md:p-12 lg:p-16">
            <header class="mb-8 text-center">
              <h1
                class="text-3xl font-extrabold leading-tight text-slate-900 md:text-4xl"
              >
                Register
              </h1>
              <p class="mt-2 text-base text-slate-600">
                Ayo menjadi bagian dari CoraTuka
              </p>
            </header>

            <div class="space-y-8">
              <!-- Sign Up As Section -->
              <div class="space-y-2 text-center">
                <p class="text-lg font-extrabold text-slate-900">Sign Up as?</p>
                <p class="text-sm text-slate-600">
                  pilih role sesuai kategori anda
                </p>
              </div>

              <!-- Group: Learner / Visitor -->
              <div class="space-y-4">
                <div
                  class="flex items-center justify-between rounded-xl bg-gradient-to-r from-primary-50 to-primary-100 px-4 py-3 border-2 border-primary-200"
                >
                  <p class="text-base font-extrabold text-slate-900">
                    Learner / Visitor
                  </p>
                </div>

                <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
                  <a
                    href="register_learner.html"
                    class="group relative w-full overflow-hidden rounded-lg bg-tertiary px-5 py-4 text-center transition hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
                  >
                    <div class="flex flex-col items-center gap-2">
                      <span class="text-sm font-extrabold text-slate-800"
                        >Learner</span
                      >
                      <span class="text-xs text-slate-600"
                        >Pelajar SMP/SMA</span
                      >
                    </div>
                  </a>

                  <a
                    href="register_visitor.html"
                    class="group relative w-full overflow-hidden rounded-lg bg-tertiary px-5 py-4 text-center transition hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
                  >
                    <div class="flex flex-col items-center gap-2">
                      <span class="text-sm font-extrabold text-slate-800"
                        >Visitor</span
                      >
                      <span class="text-xs text-slate-600"
                        >Wisatawan Bahari</span
                      >
                    </div>
                  </a>
                </div>
              </div>

              <!-- Group: Conservator -->
              <div class="space-y-4">
                <div
                  class="flex items-center justify-between rounded-xl bg-gradient-to-r from-green-50 to-green-100 px-4 py-3 border-2 border-green-200"
                >
                  <p class="text-base font-extrabold text-slate-900">
                    Conservator
                  </p>
                </div>

                <div class="grid grid-cols-1 gap-2">
                  <a
                    href="register_conservator.html"
                    class="group relative w-full overflow-hidden rounded-lg bg-tertiary px-5 py-4 text-center transition hover:-translate-y-1 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
                  >
                    <div class="flex flex-col items-center gap-2">
                      <span class="text-sm font-extrabold text-slate-800"
                        >Conservator</span
                      >
                      <span class="text-xs text-slate-600"
                        >Tim Konservasi Laut</span
                      >
                    </div>
                  </a>
                </div>
              </div>

              <!-- Footer Link -->
              <p class="pt-4 text-center text-sm text-slate-700">
                Already have an account?
                <a
                  href="../login/login.html"
                  class="font-extrabold text-primary-600 hover:text-primary-700 hover:underline"
                >
                  Login Here
                </a>
              </p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script>
      // ========================================
      // Back Button Handler
      // ========================================
      document.getElementById("btnBack")?.addEventListener("click", () => {
        window.location.href = "../login/login.html";
      });
    </script>

    <style>
      * {
        transition-property: color, background-color, border-color,
          text-decoration-color, fill, stroke, opacity, box-shadow, transform;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      *:focus-visible {
        outline: 2px solid #15c5ce;
        outline-offset: 2px;
      }
    </style>
  </body>
</html>
