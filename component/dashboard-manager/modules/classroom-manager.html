<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Classroom Manager - CORATUKA</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },
            colors: {
              primary: "#15C5CE",
              secondary: "#FF8156",
              tertiary: "#FFD166",
              ink: "#4B4B4B",
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .tab-active {
        border-bottom: 3px solid #15c5ce;
        color: #15c5ce;
        font-weight: 600;
      }

      /* EMERGENCY MODAL FIX */
      .modal-overlay {
        display: none !important;
      }

      .modal-overlay.active {
        display: flex !important;
      }

      .modal-close {
        cursor: pointer !important;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-40">
      <div class="px-6 py-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <button
              onclick="goBackToDashboard()"
              class="p-2 hover:bg-gray-100 rounded-lg transition-colors"
            >
              <svg
                class="w-6 h-6 text-gray-600"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 19l-7-7 7-7"
                />
              </svg>
            </button>
            <div>
              <h1 class="text-2xl font-bold text-ink">
                🎓 Ocean Classroom Manager
              </h1>
              <p class="text-sm text-gray-600">
                Manage classes, tasks, and student progress
              </p>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <div class="text-right">
              <p class="text-sm text-gray-600">Logged in as</p>
              <p id="conservator-name" class="font-semibold text-ink">
                Conservator
              </p>
            </div>
            <button
              onclick="logout()"
              class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="p-6">
      <div class="max-w-7xl mx-auto">
        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
          <!-- Total Classes -->
          <div class="bg-white rounded-xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <span class="text-gray-600 text-sm">Total Classes</span>
              <span class="text-2xl">🎓</span>
            </div>
            <p id="stat-total-classes" class="text-3xl font-bold text-ink">0</p>
            <p class="text-xs text-gray-500 mt-1">Active batches</p>
          </div>

          <!-- Total Students -->
          <div class="bg-white rounded-xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <span class="text-gray-600 text-sm">Total Students</span>
              <span class="text-2xl">👥</span>
            </div>
            <p id="stat-total-students" class="text-3xl font-bold text-ink">
              0
            </p>
            <p class="text-xs text-gray-500 mt-1">Enrolled participants</p>
          </div>

          <!-- Pending Tasks -->
          <div class="bg-white rounded-xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <span class="text-gray-600 text-sm">Pending Tasks</span>
              <span class="text-2xl">📝</span>
            </div>
            <p id="stat-pending-tasks" class="text-3xl font-bold text-ink">0</p>
            <p class="text-xs text-gray-500 mt-1">Awaiting review</p>
          </div>

          <!-- Certificates Issued -->
          <div class="bg-white rounded-xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <span class="text-gray-600 text-sm">Certificates</span>
              <span class="text-2xl">📜</span>
            </div>
            <p id="stat-certificates" class="text-3xl font-bold text-ink">0</p>
            <p class="text-xs text-gray-500 mt-1">Issued this month</p>
          </div>
        </div>

        <!-- Tab Navigation -->
        <div class="bg-white rounded-xl shadow-sm mb-6">
          <div class="border-b px-6">
            <div class="flex gap-8">
              <button
                onclick="switchTab('classes')"
                id="tab-classes"
                class="tab-active py-4 text-sm font-medium transition-all"
              >
                Classes
              </button>
              <button
                onclick="switchTab('tasks')"
                id="tab-tasks"
                class="py-4 text-sm font-medium text-gray-600 hover:text-primary transition-all"
              >
                Task Submissions
              </button>
              <button
                onclick="switchTab('students')"
                id="tab-students"
                class="py-4 text-sm font-medium text-gray-600 hover:text-primary transition-all"
              >
                Students
              </button>
              <button
                onclick="switchTab('certificates')"
                id="tab-certificates"
                class="py-4 text-sm font-medium text-gray-600 hover:text-primary transition-all"
              >
                Certificates
              </button>
            </div>
          </div>

          <!-- Tab Content -->
          <div class="p-6">
            <!-- Classes Tab -->
            <div id="classes-content">
              <div class="flex items-center justify-between mb-6">
                <div class="flex-1 max-w-md">
                  <input
                    type="text"
                    id="search-classes"
                    placeholder="Search classes..."
                    onkeyup="filterClasses()"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                  />
                </div>
                <button
                  onclick="openClassModal()"
                  class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-opacity-90 transition-all font-medium"
                >
                  + Create New Class
                </button>
              </div>

              <div
                id="classes-grid"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
              >
                <!-- Classes will be rendered here -->
              </div>
            </div>

            <!-- Task Submissions Tab -->
            <div id="tasks-content" class="hidden">
              <div class="flex gap-4 mb-6">
                <select
                  id="filter-task-status"
                  onchange="filterTasks()"
                  class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                >
                  <option value="all">All Status</option>
                  <option value="pending">Pending Review</option>
                  <option value="approved">Approved</option>
                  <option value="revision">Need Revision</option>
                </select>
              </div>

              <div id="tasks-list" class="space-y-4">
                <!-- Task submissions will be rendered here -->
              </div>
            </div>

            <!-- Students Tab -->
            <div id="students-content" class="hidden">
              <div class="flex gap-4 mb-6">
                <input
                  type="text"
                  id="search-students"
                  placeholder="Search students..."
                  onkeyup="filterStudents()"
                  class="flex-1 max-w-md px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                />
                <select
                  id="filter-class"
                  onchange="filterStudents()"
                  class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                >
                  <option value="all">All Classes</option>
                </select>
              </div>

              <div id="students-list" class="space-y-4">
                <!-- Students will be rendered here -->
              </div>
            </div>

            <!-- Certificates Tab -->
            <div id="certificates-content" class="hidden">
              <div id="certificates-list" class="space-y-4">
                <!-- Certificates will be rendered here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Create/Edit Class Modal -->
    <div
      id="class-modal"
      class="modal-overlay fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
    >
      <div
        class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
      >
        <div
          class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between"
        >
          <h2 id="class-modal-title" class="text-xl font-bold text-ink">
            Create New Class
          </h2>
          <button
            onclick="closeClassModal()"
            class="modal-close p-2 hover:bg-gray-100 rounded-lg transition-colors"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <form id="class-form" onsubmit="saveClass(event)" class="p-6 space-y-6">
          <input type="hidden" id="class-id" />

          <!-- Class Title -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Class Title *
            </label>
            <input
              type="text"
              id="class-title"
              required
              placeholder="e.g., Turtle Class - Batch #1"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            />
          </div>

          <!-- Theme/Topic -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Theme/Topic *
            </label>
            <input
              type="text"
              id="class-theme"
              required
              placeholder="e.g., Konservasi Penyu - Pantai Pelangi"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            />
          </div>

          <!-- Description -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Description *
            </label>
            <textarea
              id="class-description"
              required
              rows="3"
              placeholder="Describe what students will learn in this class..."
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            ></textarea>
          </div>

          <!-- Mascot -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Mascot *
            </label>
            <select
              id="class-mascot"
              required
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            >
              <option value="tuka">🐢 Tuka (Turtle)</option>
              <option value="cora">🪸 Cora (Coral)</option>
              <option value="coco">🏖️ Coco (Coastal)</option>
            </select>
          </div>

          <!-- Location -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Location *
            </label>
            <input
              type="text"
              id="class-location"
              required
              placeholder="e.g., Pantai Marina, Semarang"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            />
          </div>

          <!-- Start & End Date -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                Start Date *
              </label>
              <input
                type="date"
                id="class-start-date"
                required
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                End Date *
              </label>
              <input
                type="date"
                id="class-end-date"
                required
                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
              />
            </div>
          </div>

          <!-- Max Students -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Max Students *
            </label>
            <input
              type="number"
              id="class-max-students"
              required
              min="1"
              value="30"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            />
          </div>

          <!-- Class Code -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Class Code (for students to join) *
            </label>
            <div class="flex gap-2">
              <input
                type="text"
                id="class-code"
                required
                placeholder="e.g., TURTLE2025"
                class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
              />
              <button
                type="button"
                onclick="generateClassCode()"
                class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors"
              >
                Generate
              </button>
            </div>
          </div>

          <!-- Thumbnail URL -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              Thumbnail URL (optional)
            </label>
            <input
              type="url"
              id="class-thumbnail"
              placeholder="https://example.com/image.jpg"
              class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
            />
          </div>

          <!-- Buttons -->
          <div class="flex gap-3">
            <button
              type="button"
              onclick="closeClassModal()"
              class="flex-1 px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="flex-1 px-6 py-3 bg-primary text-white rounded-lg hover:bg-opacity-90 transition-colors"
            >
              Save Class
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/manager-core.js"></script>
    <script src="../assets/js/modal-fix.js"></script>
    <script src="../assets/js/data-init.js"></script>
    <script src="../assets/js/classroom-handler.js"></script>
  </body>
</html>
