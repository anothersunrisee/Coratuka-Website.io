<!DOCTYPE html>
<html lang="id" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create New Password – CoraTuka</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#15C5CE",
                50: "#E8F9FA",
                100: "#D0F3F5",
                200: "#B9EEF0",
                300: "#A1E8EB",
                400: "#73DCE2",
                500: "#44D1D8",
                600: "#15C5CE",
                700: "#119EA5",
              },
              secondary: { DEFAULT: "#FF8156" },
              tertiary: { DEFAULT: "#FFD166" },
              ink: "#4B4B4B",
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="min-h-full bg-gradient-to-br from-primary-50 via-white to-blue-50 font-inter text-ink"
  >
    <!-- Pop-up Notification - Centered -->
    <div
      id="notificationOverlay"
      class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/30 backdrop-blur-sm transition-all duration-300"
    >
      <div
        id="notification"
        class="mx-4 w-full max-w-md transform scale-95 opacity-0 transition-all duration-300"
      >
        <div
          class="rounded-2xl bg-white px-8 py-6 shadow-2xl border-2 border-primary-200"
        >
          <div class="flex flex-col items-center text-center">
            <div
              id="notifIcon"
              class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-tertiary/20"
            >
              <svg
                class="h-8 w-8 text-tertiary"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            </div>
            <h3 id="notifTitle" class="mb-2 text-lg font-bold text-slate-800">
              Informasi
            </h3>
            <p id="notifMessage" class="mb-6 text-sm text-slate-600">
              Pesan notifikasi
            </p>
            <button
              onclick="closeNotification()"
              class="w-full rounded-lg bg-tertiary px-6 py-3 text-sm font-bold text-slate-800 transition hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50"
            >
              Mengerti
            </button>
          </div>
        </div>
      </div>
    </div>

    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-6xl">
        <!-- Grid responsif: 1 kolom di mobile, 2 kolom di md+ -->
        <div
          class="grid grid-cols-1 gap-0 overflow-hidden rounded-3xl bg-white shadow-2xl md:grid-cols-2"
        >
          <!-- Panel kiri (gambar) -->
          <section
            class="relative overflow-hidden bg-gradient-to-br from-primary-100 to-primary-50 flex items-center justify-center p-8"
          >
            <img
              src="../../img/login/password.png"
              alt="Ilustrasi Create Password - Maskot Tuka dengan gembok emas"
              class="h-auto w-full max-h-[600px] object-contain"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />

            <!-- Fallback jika gambar tidak ada -->
            <div
              class="hidden h-full w-full items-center justify-center bg-gradient-to-br from-primary-400 to-primary-600 p-8"
            >
              <div class="text-center text-white">
                <div class="mb-4 text-6xl">🔐</div>
                <h2 class="text-2xl font-bold">Tuka</h2>
                <p class="mt-2 text-primary-100">Buat Password Baru</p>
              </div>
            </div>

            <!-- Tombol back -->
            <button
              id="btnBack"
              type="button"
              aria-label="Kembali"
              class="absolute left-4 top-4 inline-flex h-10 w-10 items-center justify-center rounded-xl bg-tertiary text-slate-800 shadow-lg transition hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
            >
              <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M15 19l-7-7 7-7"
                />
              </svg>
            </button>
          </section>

          <!-- Panel kanan (form) -->
          <section class="flex flex-col justify-center p-8 md:p-12 lg:p-16">
            <header class="mb-6 text-center">
              <h1
                class="text-3xl font-extrabold leading-tight text-slate-900 md:text-4xl"
              >
                Create New Password
              </h1>
              <p class="mt-3 text-base text-slate-600">
                Kata sandi baru Anda harus berbeda dari kata sandi yang
                digunakan sebelumnya
              </p>
            </header>

            <form
              class="w-full space-y-6"
              action="#"
              method="post"
              novalidate
              onsubmit="handleCreatePassword(event)"
            >
              <!-- New Password -->
              <div class="space-y-2">
                <label
                  for="newPassword"
                  class="block text-sm font-semibold text-slate-700"
                >
                  New Password
                </label>
                <div class="relative">
                  <input
                    id="newPassword"
                    name="newPassword"
                    type="password"
                    required
                    placeholder="Input Here"
                    class="w-full rounded-lg border-2 border-slate-200 bg-slate-50 px-4 py-3.5 pr-12 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-300 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100"
                  />
                  <button
                    type="button"
                    id="toggleNewPw"
                    aria-label="Tampilkan/Sembunyikan password"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-700 focus:outline-none"
                  >
                    <svg
                      id="eyeIconNew"
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-5 w-5 transition"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.642 0 8.58 3.012 9.964 7.178.07.214.07.43 0 .644C20.58 16.49 16.642 19.5 12 19.5c-4.64 0-8.577-3.012-9.964-7.178z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                    </svg>
                  </button>
                </div>
                <p class="text-xs text-slate-500">
                  Password must contain at least 8 characters and can't use any
                  symbols
                </p>
              </div>

              <!-- Confirm Password -->
              <div class="space-y-2">
                <label
                  for="confirmPassword"
                  class="block text-sm font-semibold text-slate-700"
                >
                  Confirm Password
                </label>
                <div class="relative">
                  <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    required
                    placeholder="Input Here"
                    class="w-full rounded-lg border-2 border-slate-200 bg-slate-50 px-4 py-3.5 pr-12 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-300 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100"
                  />
                  <button
                    type="button"
                    id="toggleConfirmPw"
                    aria-label="Tampilkan/Sembunyikan password"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-700 focus:outline-none"
                  >
                    <svg
                      id="eyeIconConfirm"
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-5 w-5 transition"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.642 0 8.58 3.012 9.964 7.178.07.214.07.43 0 .644C20.58 16.49 16.642 19.5 12 19.5c-4.64 0-8.577-3.012-9.964-7.178z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Password Strength Indicator -->
              <div class="space-y-2">
                <div class="flex items-center justify-between text-xs">
                  <span class="text-slate-600">Password Strength:</span>
                  <span id="strengthText" class="font-semibold text-slate-800"
                    >-</span
                  >
                </div>
                <div class="flex gap-1">
                  <div
                    id="strength1"
                    class="h-1.5 flex-1 rounded-full bg-slate-200 transition-all"
                  ></div>
                  <div
                    id="strength2"
                    class="h-1.5 flex-1 rounded-full bg-slate-200 transition-all"
                  ></div>
                  <div
                    id="strength3"
                    class="h-1.5 flex-1 rounded-full bg-slate-200 transition-all"
                  ></div>
                  <div
                    id="strength4"
                    class="h-1.5 flex-1 rounded-full bg-slate-200 transition-all"
                  ></div>
                </div>
              </div>

              <!-- Button Send -->
              <button
                type="submit"
                id="btnSend"
                class="inline-flex w-full items-center justify-center rounded-lg bg-tertiary px-4 py-3.5 text-sm font-extrabold text-slate-800 shadow-lg transition hover:-translate-y-0.5 hover:shadow-xl hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50 active:translate-y-0"
              >
                Send
              </button>
            </form>
          </section>
        </div>
      </div>
    </main>

    <script>
      // ========================================
      // Check if user has verified OTP
      // ========================================
      window.addEventListener("DOMContentLoaded", () => {
        const isVerified = sessionStorage.getItem("otp_verified");

        if (isVerified !== "true") {
          showNotification(
            "Eh, Tuka nemu ada yang loncat-loncat nih! Verifikasi OTP dulu ya sebelum ganti password 😊",
            "Akses Ditolak",
            "error"
          );
          setTimeout(() => {
            window.location.href = "forget-password.html";
          }, 2000);
        }
      });

      // ========================================
      // Back Button Handler
      // ========================================
      document.getElementById("btnBack")?.addEventListener("click", () => {
        window.location.href = "../login/verify_email.html";
      });

      // ========================================
      // Toggle Password Visibility
      // ========================================
      const newPwInput = document.getElementById("newPassword");
      const toggleNewBtn = document.getElementById("toggleNewPw");
      const eyeIconNew = document.getElementById("eyeIconNew");

      toggleNewBtn?.addEventListener("click", () => {
        const isVisible = newPwInput.type === "text";
        newPwInput.type = isVisible ? "password" : "text";

        eyeIconNew.innerHTML = isVisible
          ? '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.642 0 8.58 3.012 9.964 7.178.07.214.07.43 0 .644C20.58 16.49 16.642 19.5 12 19.5c-4.64 0-8.577-3.012-9.964-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>'
          : '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>';
      });

      const confirmPwInput = document.getElementById("confirmPassword");
      const toggleConfirmBtn = document.getElementById("toggleConfirmPw");
      const eyeIconConfirm = document.getElementById("eyeIconConfirm");

      toggleConfirmBtn?.addEventListener("click", () => {
        const isVisible = confirmPwInput.type === "text";
        confirmPwInput.type = isVisible ? "password" : "text";

        eyeIconConfirm.innerHTML = isVisible
          ? '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.642 0 8.58 3.012 9.964 7.178.07.214.07.43 0 .644C20.58 16.49 16.642 19.5 12 19.5c-4.64 0-8.577-3.012-9.964-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>'
          : '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>';
      });

      // ========================================
      // Password Strength Meter
      // ========================================
      newPwInput.addEventListener("input", () => {
        const password = newPwInput.value;
        const strength = calculatePasswordStrength(password);
        updateStrengthMeter(strength);
      });

      function calculatePasswordStrength(password) {
        let strength = 0;

        if (password.length >= 8) strength++;
        if (password.length >= 12) strength++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        if (/\d/.test(password)) strength++;

        return strength;
      }

      function updateStrengthMeter(strength) {
        const bars = [
          document.getElementById("strength1"),
          document.getElementById("strength2"),
          document.getElementById("strength3"),
          document.getElementById("strength4"),
        ];
        const strengthText = document.getElementById("strengthText");

        // Reset all bars
        bars.forEach((bar) => {
          bar.className =
            "h-1.5 flex-1 rounded-full bg-slate-200 transition-all";
        });

        if (strength === 0) {
          strengthText.textContent = "-";
          strengthText.className = "font-semibold text-slate-800";
        } else if (strength === 1) {
          bars[0].classList.add("bg-red-500");
          strengthText.textContent = "Lemah";
          strengthText.className = "font-semibold text-red-600";
        } else if (strength === 2) {
          bars[0].classList.add("bg-orange-500");
          bars[1].classList.add("bg-orange-500");
          strengthText.textContent = "Cukup";
          strengthText.className = "font-semibold text-orange-600";
        } else if (strength === 3) {
          bars[0].classList.add("bg-yellow-500");
          bars[1].classList.add("bg-yellow-500");
          bars[2].classList.add("bg-yellow-500");
          strengthText.textContent = "Bagus";
          strengthText.className = "font-semibold text-yellow-600";
        } else {
          bars.forEach((bar) => bar.classList.add("bg-green-500"));
          strengthText.textContent = "Kuat";
          strengthText.className = "font-semibold text-green-600";
        }
      }

      // ========================================
      // Handle Create Password Form Submit
      // ========================================
      function handleCreatePassword(event) {
        event.preventDefault();

        const newPassword = newPwInput.value;
        const confirmPassword = confirmPwInput.value;

        // Validasi password kosong
        if (!newPassword || !confirmPassword) {
          showNotification(
            "Oops! Kedua kolom password harus diisi ya. Tuka butuh keduanya untuk memastikan passwordmu aman! 🔐",
            "Field Belum Lengkap",
            "error"
          );
          return;
        }

        // Validasi panjang minimum
        if (newPassword.length < 8) {
          showNotification(
            "Password-nya masih terlalu pendek nih! Minimal 8 karakter ya biar lebih aman. Tuka percaya kamu bisa bikin yang lebih kuat! 💪",
            "Password Terlalu Pendek",
            "error"
          );
          return;
        }

        // Validasi simbol (tidak boleh ada)
        const symbolRegex = /[!@#$%^&*(),.?":{}|<>]/;
        if (symbolRegex.test(newPassword)) {
          showNotification(
            "Eh, ada simbol nih! Password nggak boleh pakai simbol ya. Cukup huruf dan angka aja 😊",
            "Simbol Tidak Diperbolehkan",
            "error"
          );
          return;
        }

        // Validasi password tidak sama
        if (newPassword !== confirmPassword) {
          showNotification(
            "Hmm... password yang kamu ketik nggak sama nih. Coba cek lagi, pastikan keduanya cocok ya! 🤔",
            "Password Tidak Sama",
            "error"
          );
          return;
        }

        // Get email from session
        const email = sessionStorage.getItem("reset_email");

        // Password valid - Save and redirect
        showNotification(
          "Yeay! Password baru berhasil dibuat! Sekarang akun kamu sudah aman lagi. Tuka senang bisa bantu! 🎉🔒",
          "Password Berhasil Dibuat!",
          "success"
        );

        // Mark as password reset complete
        sessionStorage.setItem("password_reset_complete", "true");

        console.log("=== Password Reset Complete ===");
        console.log("Email:", email);
        console.log("New Password:", newPassword);
        console.log("================================");

        // Redirect to success page
        setTimeout(() => {
          window.location.href = "../welcome/welcome.html";
        }, 2000);
      }

      // ========================================
      // Show Notification Pop-up (Centered)
      // ========================================
      function showNotification(message, title = "Informasi", type = "info") {
        const overlay = document.getElementById("notificationOverlay");
        const notification = document.getElementById("notification");
        const notifTitle = document.getElementById("notifTitle");
        const notifMessage = document.getElementById("notifMessage");
        const notifIcon = document.getElementById("notifIcon");

        notifTitle.textContent = title;
        notifMessage.textContent = message;

        let iconHTML = "";
        let iconBgColor = "";
        let iconColor = "";

        if (type === "error") {
          iconBgColor = "bg-red-100";
          iconColor = "text-red-600";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
        } else if (type === "success") {
          iconBgColor = "bg-green-100";
          iconColor = "text-green-600";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
        } else {
          iconBgColor = "bg-tertiary/20";
          iconColor = "text-tertiary";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
        }

        notifIcon.className = `mb-4 flex h-16 w-16 items-center justify-center rounded-full ${iconBgColor}`;
        notifIcon.innerHTML = `<div class="${iconColor}">${iconHTML}</div>`;

        overlay.classList.remove("hidden");
        overlay.classList.add("flex");

        setTimeout(() => {
          notification.classList.remove("scale-95", "opacity-0");
          notification.classList.add("scale-100", "opacity-100");
        }, 10);
      }

      // ========================================
      // Close Notification
      // ========================================
      function closeNotification() {
        const overlay = document.getElementById("notificationOverlay");
        const notification = document.getElementById("notification");

        notification.classList.remove("scale-100", "opacity-100");
        notification.classList.add("scale-95", "opacity-0");

        setTimeout(() => {
          overlay.classList.remove("flex");
          overlay.classList.add("hidden");
        }, 300);
      }

      // ========================================
      // Keyboard Shortcuts
      // ========================================
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const overlay = document.getElementById("notificationOverlay");
          if (!overlay.classList.contains("hidden")) {
            closeNotification();
          }
        }
      });

      // ========================================
      // Click overlay to close notification
      // ========================================
      document
        .getElementById("notificationOverlay")
        ?.addEventListener("click", (e) => {
          if (e.target.id === "notificationOverlay") {
            closeNotification();
          }
        });
    </script>

    <style>
      * {
        transition-property: color, background-color, border-color,
          text-decoration-color, fill, stroke, opacity, box-shadow, transform;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      *:focus-visible {
        outline: 2px solid #15c5ce;
        outline-offset: 2px;
      }

      #notification {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </body>
</html>
