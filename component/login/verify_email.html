<!DOCTYPE html>
<html lang="id" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify Email – CoraTuka</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#15C5CE",
                50: "#E8F9FA",
                100: "#D0F3F5",
                200: "#B9EEF0",
                300: "#A1E8EB",
                400: "#73DCE2",
                500: "#44D1D8",
                600: "#15C5CE",
                700: "#119EA5",
              },
              secondary: { DEFAULT: "#FF8156" },
              tertiary: { DEFAULT: "#FFD166" },
              ink: "#4B4B4B",
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="min-h-full bg-gradient-to-br from-primary-50 via-white to-blue-50 font-inter text-ink"
  >
    <!-- Pop-up Notification - Centered -->
    <div
      id="notificationOverlay"
      class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/30 backdrop-blur-sm transition-all duration-300"
    >
      <div
        id="notification"
        class="mx-4 w-full max-w-md transform scale-95 opacity-0 transition-all duration-300"
      >
        <div
          class="rounded-2xl bg-white px-8 py-6 shadow-2xl border-2 border-primary-200"
        >
          <div class="flex flex-col items-center text-center">
            <div
              id="notifIcon"
              class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-tertiary/20"
            >
              <svg
                class="h-8 w-8 text-tertiary"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            </div>
            <h3 id="notifTitle" class="mb-2 text-lg font-bold text-slate-800">
              Informasi
            </h3>
            <p id="notifMessage" class="mb-6 text-sm text-slate-600">
              Pesan notifikasi
            </p>
            <button
              onclick="closeNotification()"
              class="w-full rounded-lg bg-tertiary px-6 py-3 text-sm font-bold text-slate-800 transition hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50"
            >
              Mengerti
            </button>
          </div>
        </div>
      </div>
    </div>

    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-6xl">
        <!-- Grid responsif: 1 kolom di mobile, 2 kolom di md+ -->
        <div
          class="grid grid-cols-1 gap-0 overflow-hidden rounded-3xl bg-white shadow-2xl md:grid-cols-2"
        >
          <!-- Panel kiri (gambar) -->
          <section
            class="relative overflow-hidden bg-gradient-to-br from-primary-100 to-primary-50 flex items-center justify-center p-8"
          >
            <img
              src="../../img/login/email.png"
              alt="Ilustrasi Verify Email - Maskot Tuka dengan email"
              class="h-auto w-full max-h-[600px] object-contain"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />

            <!-- Fallback jika gambar tidak ada -->
            <div
              class="hidden h-full w-full items-center justify-center bg-gradient-to-br from-primary-400 to-primary-600 p-8"
            >
              <div class="text-center text-white">
                <div class="mb-4 text-6xl">📧</div>
                <h2 class="text-2xl font-bold">Tuka</h2>
                <p class="mt-2 text-primary-100">Verifikasi Email</p>
              </div>
            </div>

            <!-- Tombol back -->
            <button
              id="btnBack"
              type="button"
              aria-label="Kembali"
              class="absolute left-4 top-4 inline-flex h-10 w-10 items-center justify-center rounded-xl bg-tertiary text-slate-800 shadow-lg transition hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
            >
              <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M15 19l-7-7 7-7"
                />
              </svg>
            </button>
          </section>

          <!-- Panel kanan (form) -->
          <section class="flex flex-col justify-center p-8 md:p-12 lg:p-16">
            <header class="mb-6 text-center">
              <h1
                class="text-3xl font-extrabold leading-tight text-slate-900 md:text-4xl"
              >
                Verify Your Email
              </h1>
              <p class="mt-3 text-base text-slate-600">
                Masukkan 6 kode OTP yang sudah dikirim ke Email anda!
              </p>
            </header>

            <!-- Icon Illustration with Tuka -->
            <div class="mb-8 flex justify-center">
              <div class="relative">
                <div
                  class="flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-primary-100 to-primary-200"
                >
                  <svg
                    class="h-10 w-10 text-primary-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                    />
                  </svg>
                </div>
                <div class="absolute -right-2 -bottom-2 text-4xl">🐢</div>
              </div>
            </div>

            <form
              class="w-full space-y-8"
              action="#"
              method="post"
              novalidate
              onsubmit="handleVerifyOTP(event)"
            >
              <!-- OTP Input Boxes -->
              <div class="space-y-3">
                <div class="flex justify-center gap-2 md:gap-3">
                  <input
                    type="text"
                    maxlength="1"
                    class="otp-input h-14 w-12 md:h-16 md:w-14 rounded-lg border-2 border-slate-300 bg-white text-center text-2xl font-bold text-slate-800 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                    id="otp1"
                    data-index="0"
                  />
                  <input
                    type="text"
                    maxlength="1"
                    class="otp-input h-14 w-12 md:h-16 md:w-14 rounded-lg border-2 border-slate-300 bg-white text-center text-2xl font-bold text-slate-800 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                    id="otp2"
                    data-index="1"
                  />
                  <input
                    type="text"
                    maxlength="1"
                    class="otp-input h-14 w-12 md:h-16 md:w-14 rounded-lg border-2 border-slate-300 bg-white text-center text-2xl font-bold text-slate-800 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                    id="otp3"
                    data-index="2"
                  />

                  <input
                    type="text"
                    maxlength="1"
                    class="otp-input h-14 w-12 md:h-16 md:w-14 rounded-lg border-2 border-slate-300 bg-white text-center text-2xl font-bold text-slate-800 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                    id="otp4"
                    data-index="3"
                  />
                  <input
                    type="text"
                    maxlength="1"
                    class="otp-input h-14 w-12 md:h-16 md:w-14 rounded-lg border-2 border-slate-300 bg-white text-center text-2xl font-bold text-slate-800 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                    id="otp5"
                    data-index="4"
                  />
                  <input
                    type="text"
                    maxlength="1"
                    class="otp-input h-14 w-12 md:h-16 md:w-14 rounded-lg border-2 border-slate-300 bg-white text-center text-2xl font-bold text-slate-800 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-primary-100"
                    id="otp6"
                    data-index="5"
                  />
                </div>
              </div>

              <!-- Timer Countdown -->
              <div class="text-center">
                <p class="text-sm text-slate-600">
                  Kode berlaku dalam:
                  <span id="timer" class="font-bold text-primary-600"
                    >05:00</span
                  >
                </p>
              </div>

              <!-- Button Verify -->
              <button
                type="submit"
                id="btnVerify"
                class="inline-flex w-full items-center justify-center rounded-lg bg-tertiary px-4 py-3.5 text-sm font-extrabold text-slate-800 shadow-lg transition hover:-translate-y-0.5 hover:shadow-xl hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50 active:translate-y-0"
              >
                Verify
              </button>

              <!-- Resend OTP Link -->
              <div class="text-center">
                <p class="text-sm text-slate-700">
                  Don't recheive an Email?
                  <button
                    type="button"
                    id="btnResend"
                    class="font-extrabold text-primary-600 hover:text-primary-700 hover:underline disabled:text-slate-400 disabled:no-underline disabled:cursor-not-allowed"
                  >
                    Resend Email
                  </button>
                </p>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>

    <script>
      // ========================================
      // Check if user came from forget-password page
      // ========================================
      window.addEventListener("DOMContentLoaded", () => {
        const email = sessionStorage.getItem("reset_email");
        const otp = sessionStorage.getItem("reset_otp");

        if (!email || !otp) {
          // Redirect back to forget password if no data
          showNotification(
            "Wah, Tuka bingung nih. Kayaknya kamu belum request OTP deh. Yuk mulai dari awal! 🤔",
            "Session Tidak Valid",
            "error"
          );
          setTimeout(() => {
            window.location.href = "forget-password.html";
          }, 2000);
        } else {
          // Log OTP for demo
          console.log("=== DEMO OTP CODE ===");
          console.log("Email:", email);
          console.log("OTP Code:", otp);
          console.log("===================");

          // Start countdown timer
          startTimer();
        }
      });

      // ========================================
      // Back Button Handler
      // ========================================
      document.getElementById("btnBack")?.addEventListener("click", () => {
        window.location.href = "forget_password.html";
      });

      // ========================================
      // OTP Input Auto-Focus & Navigation
      // ========================================
      const otpInputs = document.querySelectorAll(".otp-input");

      otpInputs.forEach((input, index) => {
        // Auto focus next input
        input.addEventListener("input", (e) => {
          const value = e.target.value;

          // Only allow numbers
          if (!/^\d*$/.test(value)) {
            e.target.value = "";
            return;
          }

          if (value.length === 1 && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
        });

        // Handle backspace
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !e.target.value && index > 0) {
            otpInputs[index - 1].focus();
          }
        });

        // Handle paste
        input.addEventListener("paste", (e) => {
          e.preventDefault();
          const pastedData = e.clipboardData.getData("text").replace(/\D/g, "");

          if (pastedData.length === 6) {
            pastedData.split("").forEach((char, i) => {
              if (otpInputs[i]) {
                otpInputs[i].value = char;
              }
            });
            otpInputs[5].focus();
          }
        });
      });

      // Focus first input on load
      otpInputs[0]?.focus();

      // ========================================
      // Countdown Timer (5 minutes)
      // ========================================
      let timeLeft = 300; // 5 minutes in seconds
      let timerInterval;

      function startTimer() {
        const timerElement = document.getElementById("timer");
        const resendBtn = document.getElementById("btnResend");

        timerInterval = setInterval(() => {
          timeLeft--;

          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;

          timerElement.textContent = `${minutes
            .toString()
            .padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;

          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerElement.textContent = "00:00";
            resendBtn.disabled = false;
            showNotification(
              "Waktunya habis nih! Kode OTP sudah expired. Tapi tenang, kamu bisa minta kode baru kok! ⏰",
              "OTP Expired",
              "error"
            );
          }
        }, 1000);
      }

      // ========================================
      // Resend OTP Handler
      // ========================================
      document
        .getElementById("btnResend")
        ?.addEventListener("click", function () {
          const email = sessionStorage.getItem("reset_email");

          if (!email) {
            window.location.href = "forget-password.html";
            return;
          }

          // Generate new OTP
          const newOtp = Math.floor(100000 + Math.random() * 900000).toString();
          sessionStorage.setItem("reset_otp", newOtp);
          sessionStorage.setItem(
            "otp_timestamp",
            new Date().getTime().toString()
          );

          console.log("=== NEW OTP CODE ===");
          console.log("Email:", email);
          console.log("New OTP:", newOtp);
          console.log("===================");

          // Reset timer
          clearInterval(timerInterval);
          timeLeft = 300;
          this.disabled = true;
          startTimer();

          // Clear inputs
          otpInputs.forEach((input) => (input.value = ""));
          otpInputs[0].focus();

          showNotification(
            `Tuka kirim kode baru ke ${email}! Cek email kamu ya, jangan lupa spam folder juga 📬✨`,
            "OTP Baru Terkirim!",
            "success"
          );
        });

      // ========================================
      // Handle Verify OTP Form Submit
      // ========================================
      function handleVerifyOTP(event) {
        event.preventDefault();

        // Get OTP values
        const otpValue = Array.from(otpInputs)
          .map((input) => input.value)
          .join("");

        // Validasi OTP kosong atau tidak lengkap
        if (otpValue.length < 6) {
          showNotification(
            "Eh tunggu! Kode OTP-nya belum lengkap nih. Pastikan semua 6 kotak terisi ya! 🔢",
            "OTP Belum Lengkap",
            "error"
          );
          return;
        }

        // Fixed OTP Code untuk testing/development
        const correctOtp = "000000";

        // Verify OTP dengan kode tetap
        if (otpValue !== correctOtp) {
          showNotification(
            "Hmm... kode yang kamu masukkan salah nih. Coba cek lagi atau minta kode baru ya! Tuka yakin kamu bisa! 🤔",
            "Kode OTP Salah",
            "error"
          );

          // Shake animation for wrong OTP
          otpInputs.forEach((input) => {
            input.classList.add("shake");
            setTimeout(() => input.classList.remove("shake"), 500);
          });
          return;
        }

        // OTP Correct!
        clearInterval(timerInterval);

        showNotification(
          "Mantap! Kode OTP-nya benar! Sekarang yuk bikin password baru yang kuat dan mudah diingat 🎉🔐",
          "Verifikasi Berhasil!",
          "success"
        );

        // Mark as verified
        sessionStorage.setItem("otp_verified", "true");

        // Redirect to create new password page
        setTimeout(() => {
          window.location.href = "Reset_password.html";
        }, 2000);
      }

      // ========================================
      // Show Notification Pop-up (Centered)
      // ========================================
      function showNotification(message, title = "Informasi", type = "info") {
        const overlay = document.getElementById("notificationOverlay");
        const notification = document.getElementById("notification");
        const notifTitle = document.getElementById("notifTitle");
        const notifMessage = document.getElementById("notifMessage");
        const notifIcon = document.getElementById("notifIcon");

        notifTitle.textContent = title;
        notifMessage.textContent = message;

        let iconHTML = "";
        let iconBgColor = "";
        let iconColor = "";

        if (type === "error") {
          iconBgColor = "bg-red-100";
          iconColor = "text-red-600";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
        } else if (type === "success") {
          iconBgColor = "bg-green-100";
          iconColor = "text-green-600";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
        } else {
          iconBgColor = "bg-tertiary/20";
          iconColor = "text-tertiary";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
        }

        notifIcon.className = `mb-4 flex h-16 w-16 items-center justify-center rounded-full ${iconBgColor}`;
        notifIcon.innerHTML = `<div class="${iconColor}">${iconHTML}</div>`;

        overlay.classList.remove("hidden");
        overlay.classList.add("flex");

        setTimeout(() => {
          notification.classList.remove("scale-95", "opacity-0");
          notification.classList.add("scale-100", "opacity-100");
        }, 10);
      }

      // ========================================
      // Close Notification
      // ========================================
      function closeNotification() {
        const overlay = document.getElementById("notificationOverlay");
        const notification = document.getElementById("notification");

        notification.classList.remove("scale-100", "opacity-100");
        notification.classList.add("scale-95", "opacity-0");

        setTimeout(() => {
          overlay.classList.remove("flex");
          overlay.classList.add("hidden");
        }, 300);
      }

      // ========================================
      // Keyboard Shortcuts
      // ========================================
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const overlay = document.getElementById("notificationOverlay");
          if (!overlay.classList.contains("hidden")) {
            closeNotification();
          }
        }
      });

      // ========================================
      // Click overlay to close notification
      // ========================================
      document
        .getElementById("notificationOverlay")
        ?.addEventListener("click", (e) => {
          if (e.target.id === "notificationOverlay") {
            closeNotification();
          }
        });
    </script>

    <style>
      * {
        transition-property: color, background-color, border-color,
          text-decoration-color, fill, stroke, opacity, box-shadow, transform;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      *:focus-visible {
        outline: 2px solid #15c5ce;
        outline-offset: 2px;
      }

      #notification {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Shake animation for wrong OTP */
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      .shake {
        animation: shake 0.3s ease-in-out;
      }

      /* Hide number input arrows */
      input[type="text"]::-webkit-outer-spin-button,
      input[type="text"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>
  </body>
</html>
