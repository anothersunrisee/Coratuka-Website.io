<!DOCTYPE html>
<html lang="id" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forget Password – CoraTuka</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#15C5CE",
                50: "#E8F9FA",
                100: "#D0F3F5",
                200: "#B9EEF0",
                300: "#A1E8EB",
                400: "#73DCE2",
                500: "#44D1D8",
                600: "#15C5CE",
                700: "#119EA5",
              },
              secondary: { DEFAULT: "#FF8156" },
              tertiary: { DEFAULT: "#FFD166" },
              ink: "#4B4B4B",
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="min-h-full bg-gradient-to-br from-primary-50 via-white to-blue-50 font-inter text-ink"
  >
    <!-- Pop-up Notification - Centered -->
    <div
      id="notificationOverlay"
      class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/30 backdrop-blur-sm transition-all duration-300"
    >
      <div
        id="notification"
        class="mx-4 w-full max-w-md transform scale-95 opacity-0 transition-all duration-300"
      >
        <div
          class="rounded-2xl bg-white px-8 py-6 shadow-2xl border-2 border-primary-200"
        >
          <div class="flex flex-col items-center text-center">
            <div
              id="notifIcon"
              class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-tertiary/20"
            >
              <svg
                class="h-8 w-8 text-tertiary"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            </div>
            <h3 id="notifTitle" class="mb-2 text-lg font-bold text-slate-800">
              Informasi
            </h3>
            <p id="notifMessage" class="mb-6 text-sm text-slate-600">
              Pesan notifikasi
            </p>
            <button
              onclick="closeNotification()"
              class="w-full rounded-lg bg-tertiary px-6 py-3 text-sm font-bold text-slate-800 transition hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50"
            >
              Mengerti
            </button>
          </div>
        </div>
      </div>
    </div>

    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-6xl">
        <!-- Grid responsif: 1 kolom di mobile, 2 kolom di md+ -->
        <div
          class="grid grid-cols-1 gap-0 overflow-hidden rounded-3xl bg-white shadow-2xl md:grid-cols-2"
        >
          <!-- Panel kiri (gambar) -->
          <section
            class="relative overflow-hidden bg-gradient-to-br from-primary-100 to-primary-50 flex items-center justify-center p-8"
          >
            <img
              src="../../img/login/password.png"
              alt="Ilustrasi Forget Password - Maskot Tuka dengan gembok"
              class="h-auto w-full max-h-[600px] object-contain"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />

            <!-- Fallback jika gambar tidak ada -->
            <div
              class="hidden h-full w-full items-center justify-center bg-gradient-to-br from-primary-400 to-primary-600 p-8"
            >
              <div class="text-center text-white">
                <div class="mb-4 text-6xl">🔒</div>
                <h2 class="text-2xl font-bold">Tuka</h2>
                <p class="mt-2 text-primary-100">Reset Password</p>
              </div>
            </div>

            <!-- Tombol back -->
            <button
              id="btnBack"
              type="button"
              aria-label="Kembali ke Login"
              class="absolute left-4 top-4 inline-flex h-10 w-10 items-center justify-center rounded-xl bg-tertiary text-slate-800 shadow-lg transition hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
            >
              <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M15 19l-7-7 7-7"
                />
              </svg>
            </button>
          </section>

          <!-- Panel kanan (form) -->
          <section class="flex flex-col justify-center p-8 md:p-12 lg:p-16">
            <header class="mb-8 text-center">
              <h1
                class="text-3xl font-extrabold leading-tight text-slate-900 md:text-4xl"
              >
                Forget Password
              </h1>
              <p class="mt-3 text-base text-slate-600">
                Masukkan email anda untuk mendapatkan kode verifikasi
              </p>
            </header>

            <!-- Icon Illustration -->
            <div class="mb-8 flex justify-center">
              <div
                class="flex h-24 w-24 items-center justify-center rounded-full bg-gradient-to-br from-primary-100 to-primary-200"
              >
                <svg
                  class="h-12 w-12 text-primary-600"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                  />
                </svg>
              </div>
            </div>

            <form
              class="w-full space-y-6"
              action="#"
              method="post"
              novalidate
              onsubmit="handleForgetPassword(event)"
            >
              <!-- Email -->
              <div class="space-y-2">
                <label
                  for="email"
                  class="block text-sm font-semibold text-slate-700"
                >
                  Email
                </label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  required
                  placeholder="Input Email"
                  class="w-full rounded-lg border-2 border-slate-200 bg-slate-50 px-4 py-3.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-300 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100"
                />
              </div>

              <!-- Button Send -->
              <button
                type="submit"
                id="btnSend"
                class="inline-flex w-full items-center justify-center rounded-lg bg-tertiary px-4 py-3.5 text-sm font-extrabold text-slate-800 shadow-lg transition hover:-translate-y-0.5 hover:shadow-xl hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50 active:translate-y-0"
              >
                Send
              </button>

              <!-- Back to Login Link -->
              <p class="pt-2 text-center text-sm text-slate-700">
                Ingat password?
                <a
                  href="login.html"
                  class="font-extrabold text-primary-600 hover:text-primary-700 hover:underline"
                >
                  Back to Login
                </a>
              </p>
            </form>
          </section>
        </div>
      </div>
    </main>

    <script>
      // ========================================
      // Back Button Handler
      // ========================================
      document.getElementById("btnBack")?.addEventListener("click", () => {
        window.location.href = "login.html";
      });

      // ========================================
      // Show Notification Pop-up (Centered)
      // ========================================
      function showNotification(message, title = "Informasi", type = "info") {
        const overlay = document.getElementById("notificationOverlay");
        const notification = document.getElementById("notification");
        const notifTitle = document.getElementById("notifTitle");
        const notifMessage = document.getElementById("notifMessage");
        const notifIcon = document.getElementById("notifIcon");

        notifTitle.textContent = title;
        notifMessage.textContent = message;

        let iconHTML = "";
        let iconBgColor = "";
        let iconColor = "";

        if (type === "error") {
          iconBgColor = "bg-red-100";
          iconColor = "text-red-600";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
        } else if (type === "success") {
          iconBgColor = "bg-green-100";
          iconColor = "text-green-600";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
        } else {
          iconBgColor = "bg-tertiary/20";
          iconColor = "text-tertiary";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
        }

        notifIcon.className = `mb-4 flex h-16 w-16 items-center justify-center rounded-full ${iconBgColor}`;
        notifIcon.innerHTML = `<div class="${iconColor}">${iconHTML}</div>`;

        overlay.classList.remove("hidden");
        overlay.classList.add("flex");

        setTimeout(() => {
          notification.classList.remove("scale-95", "opacity-0");
          notification.classList.add("scale-100", "opacity-100");
        }, 10);
      }

      // ========================================
      // Close Notification
      // ========================================
      function closeNotification() {
        const overlay = document.getElementById("notificationOverlay");
        const notification = document.getElementById("notification");

        notification.classList.remove("scale-100", "opacity-100");
        notification.classList.add("scale-95", "opacity-0");

        setTimeout(() => {
          overlay.classList.remove("flex");
          overlay.classList.add("hidden");
        }, 300);
      }

      // ========================================
      // Dummy Registered Emails (from login page)
      // ========================================
      const registeredEmails = [
        "pelajar@coratuka.id",
        "wisatawan@coratuka.id",
        "konservator@coratuka.id",
        "admin@coratuka.id",
      ];

      // ========================================
      // Handle Forget Password Form Submit
      // ========================================
      function handleForgetPassword(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();

        // Validasi email kosong
        if (!email) {
          showNotification(
            "Eh tunggu dulu! Email-nya mana nih? Tuka perlu tahu email kamu buat kirim kode verifikasi loh! 📧",
            "Email Diperlukan",
            "error"
          );
          return;
        }

        // Validasi format email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showNotification(
            "Hmm... format email-nya kayaknya kurang tepat deh. Pastikan ada '@' dan domain yang benar ya! Contoh: tuka@coratuka.id 🤔",
            "Format Email Salah",
            "error"
          );
          return;
        }

        // Cek apakah email terdaftar
        const isEmailRegistered = registeredEmails.some(
          (registeredEmail) =>
            registeredEmail.toLowerCase() === email.toLowerCase()
        );

        if (!isEmailRegistered) {
          showNotification(
            `Wah, Tuka cari kemana-mana tapi email "${email}" nggak ketemu di database kami nih. Pastikan kamu sudah punya akun ya, atau daftar dulu! 🔍`,
            "Email Tidak Terdaftar",
            "error"
          );
          return;
        }

        // Email valid dan terdaftar - Generate OTP
        const otp = Math.floor(100000 + Math.random() * 900000).toString();

        // Simpan email dan OTP ke sessionStorage
        sessionStorage.setItem("reset_email", email);
        sessionStorage.setItem("reset_otp", otp);
        sessionStorage.setItem(
          "otp_timestamp",
          new Date().getTime().toString()
        );

        // Show success message
        showNotification(
          `Yeay! Kode OTP sudah Tuka kirim ke ${email}! Cek inbox atau spam folder ya. Kode berlaku 5 menit 🎉📬`,
          "OTP Terkirim!",
          "success"
        );

        // Console log OTP (for demo purposes)
        console.log("=== DEMO OTP CODE ===");
        console.log("Email:", email);
        console.log("OTP Code:", otp);
        console.log("===================");

        // Redirect ke verify page setelah 2 detik
        setTimeout(() => {
          window.location.href = "verify_email.html";
        }, 2000);
      }

      // ========================================
      // Keyboard Shortcut: ESC to close notification
      // ========================================
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const overlay = document.getElementById("notificationOverlay");
          if (!overlay.classList.contains("hidden")) {
            closeNotification();
          }
        }
      });

      // ========================================
      // Click overlay to close notification
      // ========================================
      document
        .getElementById("notificationOverlay")
        ?.addEventListener("click", (e) => {
          if (e.target.id === "notificationOverlay") {
            closeNotification();
          }
        });
    </script>

    <style>
      * {
        transition-property: color, background-color, border-color,
          text-decoration-color, fill, stroke, opacity, box-shadow, transform;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      *:focus-visible {
        outline: 2px solid #15c5ce;
        outline-offset: 2px;
      }

      #notification {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </body>
</html>
