<!DOCTYPE html>
<html lang="id" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login – CoraTuka</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#15C5CE",
                50: "#E8F9FA",
                100: "#D0F3F5",
                200: "#B9EEF0",
                300: "#A1E8EB",
                400: "#73DCE2",
                500: "#44D1D8",
                600: "#15C5CE",
                700: "#119EA5",
              },
              secondary: { DEFAULT: "#FF8156" },
              tertiary: { DEFAULT: "#FFD166" },
              ink: "#4B4B4B",
            },
            boxShadow: {
              card: "0 10px 24px rgba(17, 24, 39, 0.08)",
            },
            borderRadius: {
              xl2: "1.25rem",
            },
          },
        },
        darkMode: ["class"],
      };
    </script>
  </head>

  <body
    class="min-h-full bg-gradient-to-br from-primary-50 via-white to-blue-50 font-inter text-ink"
  >
    <!-- Pop-up Notification - Centered -->
    <div
      id="notificationOverlay"
      class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/30 backdrop-blur-sm transition-all duration-300"
    >
      <div
        id="notification"
        class="mx-4 w-full max-w-md transform scale-95 opacity-0 transition-all duration-300"
      >
        <div
          class="rounded-2xl bg-white px-8 py-6 shadow-2xl border-2 border-primary-200"
        >
          <div class="flex flex-col items-center text-center">
            <div
              id="notifIcon"
              class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-tertiary/20"
            >
              <svg
                class="h-8 w-8 text-tertiary"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            </div>
            <h3 id="notifTitle" class="mb-2 text-lg font-bold text-slate-800">
              Informasi
            </h3>
            <p id="notifMessage" class="mb-6 text-sm text-slate-600">
              Maaf, fitur ini masih dalam pengembangan
            </p>
            <button
              onclick="closeNotification()"
              class="w-full rounded-lg bg-tertiary px-6 py-3 text-sm font-bold text-slate-800 transition hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50"
            >
              Mengerti
            </button>
          </div>
        </div>
      </div>
    </div>

    <main class="flex min-h-screen items-center justify-center px-4 py-8">
      <div class="w-full max-w-6xl">
        <!-- Grid responsif: 1 kolom di mobile, 2 kolom di md+ dengan layout centered -->
        <div
          class="grid grid-cols-1 gap-0 overflow-hidden rounded-3xl bg-white shadow-2xl md:grid-cols-2"
        >
          <!-- Panel kiri (gambar) -->
          <section
            class="relative overflow-hidden bg-gradient-to-br from-primary-100 to-primary-50 flex items-center justify-center p-8"
          >
            <img
              src="../../img/login/login.png"
              alt="Ilustrasi login CoraTuka - Maskot Tuka"
              class="h-auto w-full max-h-[600px] object-contain"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />

            <!-- Fallback jika gambar tidak ada -->
            <div
              class="hidden h-full w-full items-center justify-center bg-gradient-to-br from-primary-400 to-primary-600 p-8"
            >
              <div class="text-center text-white">
                <div class="mb-4 text-6xl">🐢</div>
                <h2 class="text-2xl font-bold">CORATUKA</h2>
                <p class="mt-2 text-primary-100">Edukasi & Konservasi Laut</p>
              </div>
            </div>

            <!-- Tombol close/back -->
            <button
              id="btnBack"
              type="button"
              aria-label="Kembali"
              class="absolute left-4 top-4 inline-flex h-10 w-10 items-center justify-center rounded-xl bg-tertiary text-slate-800 shadow-lg transition hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary-300"
            >
              <span class="text-2xl font-bold leading-none">×</span>
            </button>
          </section>

          <!-- Panel kanan (form) -->
          <section class="flex flex-col justify-center p-8 md:p-12 lg:p-16">
            <header class="mb-8 text-center">
              <h1
                class="text-3xl font-extrabold leading-tight text-slate-900 md:text-4xl"
              >
                Welcome Back!
              </h1>
              <p class="mt-2 text-base text-slate-600">
                Ayo, masih banyak yang belum kita jelajahi
              </p>
            </header>

            <form
              class="w-full space-y-5"
              action="#"
              method="post"
              novalidate
              onsubmit="handleLogin(event)"
            >
              <!-- Email -->
              <div class="space-y-2">
                <label
                  for="email"
                  class="block text-xs font-semibold uppercase tracking-wide text-slate-600"
                >
                  Email
                </label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  required
                  placeholder="you@example.com"
                  class="w-full rounded-lg border-2 border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-300 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100"
                />
              </div>

              <!-- Password -->
              <div class="space-y-2">
                <label
                  for="password"
                  class="block text-xs font-semibold uppercase tracking-wide text-slate-600"
                >
                  Password
                </label>
                <div class="relative">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    placeholder="••••••••"
                    class="w-full rounded-lg border-2 border-slate-200 bg-slate-50 px-4 py-3 pr-12 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 hover:border-slate-300 focus:border-primary-500 focus:bg-white focus:ring-4 focus:ring-primary-100"
                  />
                  <button
                    type="button"
                    id="togglePw"
                    aria-label="Tampilkan/Sembunyikan password"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-700 focus:outline-none"
                  >
                    <!-- eye icon -->
                    <svg
                      id="eyeIcon"
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-5 w-5 transition"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.642 0 8.58 3.012 9.964 7.178.07.214.07.43 0 .644C20.58 16.49 16.642 19.5 12 19.5c-4.64 0-8.577-3.012-9.964-7.178z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Remember / Forgot -->
              <div class="flex items-center justify-between">
                <label
                  class="inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer"
                >
                  <input
                    type="checkbox"
                    class="h-4 w-4 rounded border-slate-300 text-primary-600 transition focus:ring-2 focus:ring-primary-300 focus:ring-offset-1 cursor-pointer"
                  />
                  <span>Remember me</span>
                </label>
                <a
                  href="forget_password.html"
                  class="text-sm font-semibold text-primary-600 hover:text-primary-700 hover:underline"
                >
                  Forget Password?
                </a>
              </div>

              <!-- Button Login -->
              <button
                type="submit"
                id="btnLogin"
                class="inline-flex w-full items-center justify-center rounded-lg bg-tertiary px-4 py-3.5 text-sm font-extrabold text-slate-800 shadow-lg transition hover:-translate-y-0.5 hover:shadow-xl hover:bg-yellow-400 focus:outline-none focus:ring-4 focus:ring-tertiary/50 active:translate-y-0"
              >
                Login
              </button>

              <!-- Divider OR -->
              <div class="flex items-center gap-4 py-2">
                <div class="h-px flex-1 bg-slate-200"></div>
                <span class="text-sm font-medium text-slate-500">Or</span>
                <div class="h-px flex-1 bg-slate-200"></div>
              </div>

              <!-- Google Login Button -->
              <button
                type="button"
                onclick="handleGoogleLogin()"
                class="inline-flex w-full items-center justify-center gap-3 rounded-lg border-2 border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-800 shadow-sm transition hover:border-slate-300 hover:bg-slate-50 hover:shadow focus:outline-none focus:ring-4 focus:ring-primary-100"
              >
                <svg class="h-5 w-5" viewBox="0 0 24 24">
                  <path
                    fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  />
                </svg>
                <span>Login with Google</span>
              </button>

              <!-- Footer -->
              <p class="pt-4 text-center text-sm text-slate-700">
                Don't have an account?
                <a
                  href="../register/register.html"
                  class="font-extrabold text-primary-600 hover:text-primary-700 hover:underline"
                >
                  Register Here
                </a>
              </p>
            </form>
          </section>
        </div>
      </div>
    </main>

    <script>
      // ========================================
      // Back/Close Button Handler
      // ========================================
      document.getElementById("btnBack")?.addEventListener("click", () => {
        window.location.href = "../../Index.html";
      });

      // ========================================
      // Toggle Password Visibility
      // ========================================
      const pwInput = document.getElementById("password");
      const toggleBtn = document.getElementById("togglePw");
      const eyeIcon = document.getElementById("eyeIcon");

      toggleBtn?.addEventListener("click", () => {
        const isPasswordVisible = pwInput.type === "text";
        pwInput.type = isPasswordVisible ? "password" : "text";

        // Update icon SVG
        eyeIcon.innerHTML = isPasswordVisible
          ? '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.642 0 8.58 3.012 9.964 7.178.07.214.07.43 0 .644C20.58 16.49 16.642 19.5 12 19.5c-4.64 0-8.577-3.012-9.964-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>'
          : '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>';
      });

      // ========================================
      // Show Notification Pop-up (Centered)
      // ========================================
      function showNotification(message, title = "Informasi", type = "info") {
        const overlay = document.getElementById("notificationOverlay");
        const notification = document.getElementById("notification");
        const notifTitle = document.getElementById("notifTitle");
        const notifMessage = document.getElementById("notifMessage");
        const notifIcon = document.getElementById("notifIcon");

        // Set content
        notifTitle.textContent = title;
        notifMessage.textContent = message;

        // Set icon based on type
        let iconHTML = "";
        let iconBgColor = "";
        let iconColor = "";

        if (type === "error") {
          iconBgColor = "bg-red-100";
          iconColor = "text-red-600";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
        } else if (type === "success") {
          iconBgColor = "bg-green-100";
          iconColor = "text-green-600";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
        } else {
          iconBgColor = "bg-tertiary/20";
          iconColor = "text-tertiary";
          iconHTML =
            '<svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
        }

        notifIcon.className = `mb-4 flex h-16 w-16 items-center justify-center rounded-full ${iconBgColor}`;
        notifIcon.innerHTML = `<div class="${iconColor}">${iconHTML}</div>`;

        // Show overlay and notification
        overlay.classList.remove("hidden");
        overlay.classList.add("flex");

        // Trigger animation
        setTimeout(() => {
          notification.classList.remove("scale-95", "opacity-0");
          notification.classList.add("scale-100", "opacity-100");
        }, 10);
      }

      // ========================================
      // Close Notification
      // ========================================
      function closeNotification() {
        const overlay = document.getElementById("notificationOverlay");
        const notification = document.getElementById("notification");

        notification.classList.remove("scale-100", "opacity-100");
        notification.classList.add("scale-95", "opacity-0");

        setTimeout(() => {
          overlay.classList.remove("flex");
          overlay.classList.add("hidden");
        }, 300);
      }

      // ========================================
      // Dummy Accounts Database
      // ========================================
      const dummyAccounts = [
        {
          email: "pelajar@coratuka.id",
          password: "pelajar123",
          role: "Pelajar",
        },
        {
          email: "wisatawan@coratuka.id",
          password: "wisata123",
          role: "Wisatawan",
        },
        {
          email: "konservator@coratuka.id",
          password: "konservasi123",
          role: "Tim Konservator",
        },
        { email: "admin@coratuka.id", password: "admin123", role: "Admin" },
      ];

      // ========================================
      // Handle Login Form Submit
      // ========================================
      function handleLogin(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        // Validasi field kosong
        if (!email && !password) {
          showNotification(
            "Oops! Email dan password belum diisi nih. Yuk lengkapi dulu biar bisa masuk! 🐢",
            "Data Belum Lengkap",
            "error"
          );
          return;
        }

        if (!email) {
          showNotification(
            "Email-mu mana ya? Isi dulu yuk biar Tuka bisa kenalan sama kamu! 📧",
            "Email Diperlukan",
            "error"
          );
          return;
        }

        if (!password) {
          showNotification(
            "Password-nya ketinggalan! Tuka nggak bisa buka pintu tanpa kunci yang tepat loh 🔑",
            "Password Diperlukan",
            "error"
          );
          return;
        }

        // Cari akun yang cocok dengan email
        const account = dummyAccounts.find(
          (acc) => acc.email.toLowerCase() === email.toLowerCase()
        );

        // Jika email tidak ditemukan
        if (!account) {
          showNotification(
            `Hmm... Tuka cari-cari tapi nggak ketemu akun dengan email "${email}". Mungkin kamu belum daftar? Yuk register dulu! 🔍`,
            "Akun Tidak Ditemukan",
            "error"
          );
          return;
        }

        // Jika email cocok tapi password salah
        if (account.password !== password) {
          showNotification(
            `Email-nya sudah benar, tapi password-nya kayaknya salah deh. Coba cek lagi ya! Jangan sampai Tuka kecewa 🙈🔐`,
            "Password Salah",
            "error"
          );
          return;
        }

        // Login berhasil
        showNotification(
          `Yeay! Selamat datang kembali, ${account.role}! 🎉 Tuka udah kangen nih sama kamu. Ayo lanjut petualangan kita di laut! 🌊`,
          "Login Berhasil!",
          "success"
        );

        // Simpan session (localStorage)
        localStorage.setItem(
          "coratuka_user",
          JSON.stringify({
            email: account.email,
            role: account.role,
            loginTime: new Date().toISOString(),
          })
        );

        // Redirect setelah 2 detik
        setTimeout(() => {
          console.log("Redirecting to dashboard...");
          window.location.href = "../welcome/welcome.html";
          alert(
            "Demo: Akan redirect ke dashboard\n\nAkun yang login:\nEmail: " +
              account.email +
              "\nRole: " +
              account.role
          );
        }, 2000);
      }

      // ========================================
      // Show Google Login Under Development Message
      // ========================================
      function handleGoogleLogin() {
        showNotification(
          "Tuka dan tim masih sibuk berenang ngatur fitur ini nih! Tunggu sebentar ya, nanti pasti bisa login pakai Google juga 🏊‍♂️💙",
          "Fitur Dalam Pengembangan",
          "info"
        );
      }

      // ========================================
      // Keyboard Shortcut: ESC to close
      // ========================================
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const overlay = document.getElementById("notificationOverlay");
          if (!overlay.classList.contains("hidden")) {
            closeNotification();
          }
        }
      });

      // ========================================
      // Click overlay to close notification
      // ========================================
      document
        .getElementById("notificationOverlay")
        ?.addEventListener("click", (e) => {
          if (e.target.id === "notificationOverlay") {
            closeNotification();
          }
        });
    </script>

    <style>
      /* Smooth transitions */
      * {
        transition-property: color, background-color, border-color,
          text-decoration-color, fill, stroke, opacity, box-shadow, transform;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }

      /* Focus visible for accessibility */
      *:focus-visible {
        outline: 2px solid #15c5ce;
        outline-offset: 2px;
      }

      /* Notification transition */
      #notification {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </body>
</html>
